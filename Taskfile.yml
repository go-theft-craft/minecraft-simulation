version: "3"

vars:
  MODULE:
    # GOWORK=off, because a go.work makes `go list -m` print every module in
    # the workspace and this wants one. With two, the gci prefix section below
    # is a two-line string that matches nothing, both modules land in one
    # group, and `task fmt` then writes what `task fmt:check` rejects — a local
    # gate disagreeing with CI, which is the failure P4 names.
    sh: GOWORK=off go list -m
  MCREFERENCE_VERSION: '{{.MCREFERENCE_VERSION | default "main"}}'

tasks:
  deps:
    desc: Download and normalize Go dependencies
    sources: [go.mod, go.sum]
    cmds:
      - go mod download
      - go mod tidy

  fmt:
    desc: Format Go source
    deps: [deps]
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/go-theft-craft)" -s "prefix({{.MODULE}})" .
      - gofumpt -w .

  fmt:check:
    desc: Check Go formatting without changing files
    deps: [deps]
    cmds:
      - |
        formatting_diff="$(golangci-lint fmt --diff)"
        if [ -n "$formatting_diff" ]; then
          printf '%s\n' "$formatting_diff"
          exit 1
        fi

  lint:
    desc: Run static analysis
    deps: [fmt:check]
    cmds:
      - golangci-lint run

  test:
    desc: Run unit tests with the race detector
    deps: [deps]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out {{.CLI_ARGS | default "./..."}}

  test:fast:
    desc: Run unit tests without the race detector, for the edit loop
    deps: [deps]
    # The same tests as test. The race detector's instrumented rebuild is what
    # separates them, and every source edit invalidates it — measured at 23
    # seconds against 2 on a sibling tree. Run this while editing and test
    # before committing; verify still runs the race lane, which is the only one
    # that finds the failure you cannot reproduce on purpose.
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  build:
    desc: Build every package
    deps: [deps]
    cmds:
      - go build ./...

  determinism:
    # No deps, deliberately. This is the one task that runs where devbox does
    # not: the determinism matrix covers Windows, which cannot provision through
    # Nix. It needs a Go toolchain and nothing else — no linters, no scanners, no
    # JDK, no game jar. Keep it that way, or the matrix stops covering six
    # platforms.
    desc: Replay the committed recordings and compare digests, with only a Go toolchain
    cmds:
      - go test ./replay/ -run TestRecordingsAreReproducible {{.CLI_ARGS}}

  vuln:
    desc: Check dependencies for known vulnerabilities
    deps: [deps]
    cmds:
      - govulncheck ./...

  secrets:
    desc: Scan project files except generated local workspaces
    cmds:
      - gitleaks dir --config .gitleaks.toml --no-banner --redact --verbose .

  secrets:staged:
    desc: Scan staged changes for secrets
    cmds:
      - gitleaks git --config .gitleaks.toml --no-banner --redact --verbose --staged

  precommit:
    desc: Run checks required before a commit
    cmds:
      - task: lint
      - task: secrets:staged

  verify:
    desc: Run all local checks
    cmds:
      - task: lint
      - task: secrets
      - task: test
      - task: vuln
      - task: build

  release:check:
    desc: Verify a clean release candidate
    requires:
      vars: [VERSION]
    cmds:
      - task: verify
      - task: determinism
      - cmd: test -z "$(git status --porcelain)"
        platforms: [linux, darwin]
      - cmd: '! grep -Eq ''^replace[[:space:]]'' go.mod'
        platforms: [linux, darwin]
      - cmd: printf '%s\n' '{{.VERSION}}' | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
        platforms: [linux, darwin]

  reference:prepare:
    desc: Prepare Minecraft reference artifacts with minecraft-reference
    requires:
      vars: [VERSIONS]
    vars:
      SIDES: '{{.SIDES | default "client,server"}}'
      REFERENCE_DIR: '{{.REFERENCE_DIR | default "reference/work"}}'
    cmds:
      - >-
        go run github.com/go-theft-craft/minecraft-reference/cmd/mcreference@{{.MCREFERENCE_VERSION}} prepare
        --versions '{{.VERSIONS}}'
        --sides '{{.SIDES}}'
        --workspace .
        --reference-dir '{{.REFERENCE_DIR}}'

  reference:clean:
    desc: Remove the validated local reference workspace
    vars:
      REFERENCE_DIR: '{{.REFERENCE_DIR | default "reference/work"}}'
    cmds:
      - >-
        go run github.com/go-theft-craft/minecraft-reference/cmd/mcreference@{{.MCREFERENCE_VERSION}} clean
        --workspace . --reference-dir '{{.REFERENCE_DIR}}' --yes

  default:
    cmds:
      - task --list
